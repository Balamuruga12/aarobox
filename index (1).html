<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FruitBox | Admin & Delivery Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#080b1c;--glass:rgba(255,255,255,.065);--line:rgba(255,255,255,.12);--tx:#f2f3ff;--mut:#9ba4c9;--vio:#8b6cff;--man:#ffb020;--grn:#00d99a;--red:#ff4f79}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif}
body{background:radial-gradient(600px 400px at 90% -5%,rgba(139,108,255,.35),transparent),radial-gradient(500px 400px at -10% 30%,rgba(255,176,32,.14),transparent),var(--bg);min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:22px 18px 90px}
header{position:relative}
#out{border-radius:18px;padding:12px 18px;background:rgba(255,255,255,.07);white-space:nowrap}
#out:active,button:active{transform:translateY(1px)}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
h1{font-size:22px;margin:0;letter-spacing:-.02em}
h1 span{color:var(--man)}
select,input,button{font:inherit;color:var(--tx)}
select,input{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
select{width:auto}
button{cursor:pointer;border:1px solid var(--line);background:var(--glass);border-radius:12px;padding:10px 14px}
button.pri{background:linear-gradient(135deg,var(--vio),#5f8bff);border:0;font-weight:700;box-shadow:0 0 22px rgba(139,108,255,.55)}
:focus-visible{outline:2px solid var(--man);outline-offset:2px}
.tabs{display:flex;gap:10px;margin:18px 0 16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;min-height:54px;padding:12px 18px;border-radius:18px;background:rgba(255,255,255,.055);font-size:15px}
.tabs button.on{border-color:var(--man);color:var(--man);box-shadow:0 0 14px rgba(255,176,32,.28);background:rgba(255,176,32,.07)}
.card{background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.045));border:1px solid var(--line);border-radius:22px;padding:16px;backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.grid .card{min-height:126px;display:flex;flex-direction:column;justify-content:center}
.big{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1.18;margin-top:5px}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.pos{color:var(--red)}.zero{color:var(--grn)}
#main>.card{margin-bottom:12px}
#main>p.mut{line-height:1.5;margin-top:20px}
input,select{min-height:44px}
@media(max-width:420px){.wrap{padding:18px 14px 80px}.grid{gap:10px}.grid .card{min-height:118px;padding:13px}.big{font-size:29px}.tabs button{padding:11px 15px;min-height:50px}}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(53,224,161,.15);color:var(--grn)}
.pill.p{background:rgba(255,176,32,.15);color:var(--man)}
.modal{position:fixed;inset:0;background:rgba(3,4,12,.75);display:none;align-items:flex-end;justify-content:center;z-index:5}
.modal.on{display:flex}
.sheet{background:#12162e;border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:720px;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.step{display:flex;align-items:center;gap:14px;margin:8px 0 14px}
.step button{width:44px;height:44px;font-size:20px}
.err{color:var(--red);font-size:13px;min-height:18px}
.seg{display:flex;gap:8px;margin:6px 0 12px}.seg button{flex:1}.seg button.on{border-color:var(--man);color:var(--man);box-shadow:0 0 14px rgba(255,176,32,.35)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--grn);color:#04130c;padding:10px 18px;border-radius:99px;font-weight:700;display:none;z-index:9}

/* FruitBox professional UI refresh */
:root{--bg:#0b0d18;--glass:rgba(255,255,255,.055);--line:rgba(255,255,255,.095);--tx:#f5f5fb;--mut:#a1a4b8;--vio:#8065f5;--man:#ffad32;--grn:#39d6a2;--red:#ff7188}
body{background:radial-gradient(850px 520px at 85% -12%,rgba(128,101,245,.22),transparent 65%),radial-gradient(650px 420px at -12% 20%,rgba(255,173,50,.09),transparent 65%),#0b0d18}
.wrap{max-width:1080px;padding:30px 28px 72px}
header{padding:4px 0 20px;margin-bottom:8px;border-bottom:1px solid var(--line)}
h1{font-size:27px;font-weight:700;letter-spacing:-.8px}
h1:before{content:'🍊';font-size:22px;margin-right:9px}
h1 span{color:var(--man)}
#out{border-radius:12px;padding:10px 16px;background:rgba(255,255,255,.06);font-size:13px}
.tabs{margin:20px 0 22px;gap:9px;overflow:visible;flex-wrap:wrap}
.tabs button{min-height:43px;padding:10px 16px;border-radius:12px;background:rgba(255,255,255,.035);font-size:14px;color:#c7c8d5;transition:.18s ease}
.tabs button:hover{background:rgba(255,255,255,.085);border-color:rgba(255,255,255,.2)}
.tabs button.on{background:rgba(255,173,50,.12);border:1px solid rgba(255,173,50,.55);color:#ffc36d;box-shadow:none;font-weight:700}
.card{background:linear-gradient(145deg,rgba(27,30,49,.94),rgba(20,22,38,.94));border:1px solid rgba(255,255,255,.085);border-radius:18px;padding:20px;box-shadow:0 12px 34px rgba(0,0,0,.12)}
.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.grid .card{min-height:142px;justify-content:space-between;position:relative;overflow:hidden}
.grid .card:after{content:'';position:absolute;width:90px;height:90px;border-radius:50%;right:-34px;top:-38px;background:rgba(128,101,245,.09)}
.big{font-size:clamp(25px,3vw,34px);margin-top:12px}
.mut{font-size:13px;line-height:1.5}
.row{padding:15px 2px;border-bottom-color:rgba(255,255,255,.075)}
#main>.card{margin-bottom:16px}
#main>.card>b{font-size:16px;letter-spacing:.1px}
button{transition:background .18s,border-color .18s,transform .18s}
button:hover{border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.09)}
button.pri{background:linear-gradient(135deg,#8065f5,#6651d9);box-shadow:0 7px 18px rgba(102,81,217,.2);border-radius:12px}
button.pri:hover{background:linear-gradient(135deg,#927cff,#7562e8)}
input,select{background:#111426;border-color:rgba(255,255,255,.13);border-radius:11px;min-height:46px}
input:focus,select:focus{border-color:var(--vio);outline:none;box-shadow:0 0 0 3px rgba(128,101,245,.14)}
.pill{font-weight:600;padding:5px 10px}
.tbl{border-radius:12px}
table{min-width:520px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em}
td,th{padding:12px 10px}
.modal{align-items:center;padding:18px;backdrop-filter:blur(7px)}
.sheet{width:100%;max-width:560px;border-radius:20px;background:#171a2d;padding:24px;max-height:88vh;overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,.45)}
.toast{bottom:26px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#main>div.card[style*="margin-top:40px"]{max-width:460px;margin:54px auto 0!important;padding:28px}
#main>div.card[style*="margin-top:40px"] .big{font-size:30px}
#main>div.card[style*="margin-top:40px"] p{padding:12px;background:rgba(255,255,255,.035);border-radius:10px}
@media(max-width:760px){.wrap{padding:20px 16px 60px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.grid .card{min-height:126px;padding:16px}.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:5px}.tabs button{flex:0 0 auto}.card{padding:16px}}
@media(max-width:380px){.wrap{padding:16px 12px 55px}.grid{gap:8px}.grid .card{padding:13px;min-height:116px}.big{font-size:25px}h1{font-size:23px}}

</style>
</head>
<body>
<div class="wrap">
<header><div><h1>Fruit<span>Box</span></h1><div class="mut" style="margin:5px 0 0 34px;letter-spacing:.02em">Fresh delivery · Simple daily management</div></div>
<button id="out" style="display:none" onclick="logout()">Logout</button></header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const PRICE=250;
const PLANS={daily:'Daily',weekly:'Weekly (6 days)',monthly:'Monthly (26 days)'};
let PRODUCTS=[
{id:'fruits',name:'Fruits Box',emoji:'🍉',daily:30,weekly:170,monthly:650},
{id:'sprouts',name:'Sprouts Mix Box',emoji:'🌱',daily:30,weekly:170,monthly:650},
{id:'basic',name:'Basic Nutrition Box',emoji:'🥗',daily:null,weekly:415,monthly:1690},
{id:'standard',name:'Standard Nutrition Box',emoji:'🍌',daily:null,weekly:570,monthly:2340},
{id:'royal',name:'Royal Nutrition Box',emoji:'👑',daily:null,weekly:750,monthly:3120}
];
let GONE=[],GONEU=[];
const P=id=>PRODUCTS.find(p=>p.id===id)||GONE.find(p=>p.id===id)||PRODUCTS[0];
const amt=l=>l.amt!=null?l.amt:l.qty*PRICE;
const pn=l=>l.pid?((PRODUCTS.find(p=>p.id===l.pid)||GONE.find(p=>p.id===l.pid)||{name:l.pname||'Product'}).name)+(l.plan&&l.plan!=='daily'?' ('+l.plan+')':''):'Fruit box';
let pid='fruits',plan='daily';
const unit=()=>P(pid)[plan];
const cAmt=()=>qty*(unit()||0);
const users=[];
let customers=[];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const T=iso(new Date());
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
let log=[];
let me=null;let tab='dash',repDate=T,sq='';
const $=s=>document.querySelector(s);
const inr=n=>'₹'+n.toLocaleString('en-IN');
const dn=id=>(users.find(u=>u.id===id)||GONEU.find(u=>u.id===id)||{}).name||'-';

function init(){
 $('#who').innerHTML=users.map(u=>`<option value="${u.id}">${u.name}</option>`).join('');
 $('#who').onchange=e=>{me=users.find(u=>u.id===e.target.value);tab=me.role==='admin'?'dash':'route';render()};
 render();
}
function render(){
 const t=me.role==='admin'?[['dash','Dashboard'],['cust','Customers'],['rep','Daily report'],['team','Delivery users'],['prods','Products']]:[['ddash','Dashboard'],['route','My route']];
 $('#tabs').innerHTML=t.map(x=>`<button class="${tab===x[0]?'on':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('');
 $('#main').innerHTML=({dash,cust,rep,route,team,ddash,prods})[tab]();
}
function stats(list){return{cash:list.filter(l=>l.mode==='Cash').reduce((a,l)=>a+l.paid,0),gpay:list.filter(l=>l.mode==='GPay').reduce((a,l)=>a+l.paid,0),boxes:list.reduce((a,l)=>a+l.qty,0),coll:list.reduce((a,l)=>a+l.paid,0),sale:list.reduce((a,l)=>a+amt(l),0)}}
function dash(){
 const s=stats(log.filter(l=>l.date===T)),pend=customers.reduce((a,c)=>a+c.bal,0);
 return `<div class="grid">
 <div class="card"><div class="mut">Boxes today</div><div class="big">${s.boxes}</div></div>
 <div class="card"><div class="mut">Collected today</div><div class="big zero">${inr(s.coll)}</div><div class="mut">Cash ${inr(s.cash)} · GPay ${inr(s.gpay)}</div></div>
 <div class="card"><div class="mut">Total pending</div><div class="big pos">${inr(pend)}</div></div>
 <div class="card"><div class="mut">Customers</div><div class="big">${customers.length}</div></div></div>
 <div class="card"><b>Top pending balances</b>${[...customers].sort((a,b)=>b.bal-a.bal).slice(0,4).map(c=>`<div class="row"><div>${c.name}<div class="mut">${c.area}</div></div><b class="${c.bal?'pos':'zero'}">${inr(c.bal)}</b></div>`).join('')}</div>
 `;
}
function cust(){
 return `<button class="pri" style="margin-bottom:12px" onclick="addCust()">+ Add customer</button>
 <div class="card">${customers.map(c=>`<div class="row"><div>${c.name} <span class="mut">${c.id}</span><div class="mut">${c.phone} · ${c.area} · ${dn(c.del)}</div></div><b class="${c.bal?'pos':'zero'}">${inr(c.bal)}</b></div>`).join('')}</div>`;
}
function rep(){
 const ds=users.filter(u=>u.role==='delivery');
 const rows=ds.map(u=>{const l=log.filter(x=>x.by===u.id),s=stats(l);const pend=customers.filter(c=>c.del===u.id).reduce((a,c)=>a+c.bal,0);return `<tr><td>${u.name.split(' ')[0]}</td><td>${s.boxes}</td><td>${inr(s.cash)}</td><td>${inr(s.gpay)}</td><td>${inr(pend)}</td></tr>`}).join('');
 return `<div class="card tbl"><b>Today by delivery user</b><table><tr><th>User</th><th>Boxes</th><th>Cash</th><th>GPay</th><th>Pending</th></tr>${rows}</table></div>
 <div class="card tbl" style="margin-top:12px"><b>Entries</b>${log.length?`<table><tr><th>Customer</th><th>Product</th><th>Qty</th><th>Paid</th><th>Mode</th><th>By</th></tr>${log.map(l=>`<tr><td>${l.name}</td><td>${pn(l)}</td><td>${l.qty}</td><td>${inr(l.paid)}</td><td>${l.mode}</td><td>${l.by==='d1'?'Ravi':'Kumar'}</td></tr>`).join('')}</table>`:'<p class="mut">Innum entry illa.</p>'}</div>`;
}
function route(){
 const mine=customers.filter(c=>c.del===me.id);
 const done=id=>log.some(l=>l.cid===id);
 return `<div class="card"><b>Indha naal route</b> <span class="mut">${log.filter(l=>l.by===me.id).length}/${mine.length} done</span>${mine.map(c=>`<div class="row"><div>${c.name}<div class="mut">${c.area} · ${c.phone}</div><div class="${c.bal?'pos':'zero'}">Balance ${inr(c.bal)}</div></div>${done(c.id)?`<div style="text-align:right"><span class="pill">Delivered</span><div><button style="margin-top:6px;padding:6px 12px" onclick="editDel('${c.id}')">Edit</button></div></div>`:`<button class="pri" onclick="openDel('${c.id}')">Deliver</button>`}</div>`).join('')}</div>`;
}
let cur=null,qty=1,mode='Cash',ed=null;
const base=()=>cur.bal-(ed?amt(ed)-ed.paid:0);
function openDel(id){cur=customers.find(c=>c.id===id);pid=PRODUCTS[0].id;plan='daily';qty=1;mode='Cash';ed=null;sheet()}
function editDel(id){cur=customers.find(c=>c.id===id);ed=log.find(l=>l.cid===id);pid=PRODUCTS.some(p=>p.id===ed.pid)?ed.pid:PRODUCTS[0].id;plan=ed.plan||'daily';qty=ed.qty;mode=ed.mode==='GPay'?'GPay':'Cash';sheet()}
function sheet(){
 $('#sheet').innerHTML=`<b>${cur.name}</b>${ed?' <span class="pill p">Editing entry</span>':''}<div class="mut">Balance before this entry ${inr(base())}</div>
 <div class="mut" style="margin-top:12px">Product</div><select id="pr" style="width:100%" onchange="pid=this.value;upd()">${PRODUCTS.map(p=>`<option value="${p.id}"${p.id===pid?' selected':''}>${p.emoji} ${p.name}</option>`).join('')}</select>
 <div class="mut" style="margin-top:10px">Plan</div><div class="seg" id="pl"></div>
 <div class="mut" style="margin-top:6px">Quantity</div>
 <div class="step"><button onclick="qty=Math.max(1,qty-1);upd()">−</button><div class="big" id="q">${qty}</div><button onclick="qty++;upd()">+</button></div>
 <div class="mut">Payment collected (₹)</div><input id="paid" type="number" inputmode="numeric" value="${ed?ed.paid:0}" min="0" oninput="upd()">
 <div class="mut" style="margin-top:10px">Payment mode</div><div class="seg"><button id="m1" onclick="mode='Cash';upd()">Cash</button><button id="m2" onclick="mode='GPay';upd()">GPay</button></div>
 <p class="mut" id="nb"></p><div style="display:flex;gap:10px"><button onclick="closeM()">Cancel</button><button class="pri" style="flex:1" onclick="saveDel()">Save entry</button></div>`;
 $('#modal').classList.add('on');upd();
}
function upd(){$('#q').textContent=qty;const p=+$('#paid').value||0;$('#m1').className=mode==='Cash'?'on':'';$('#m2').className=mode==='GPay'?'on':'';
 $('#pl').innerHTML=['daily','weekly','monthly'].map(k=>`<button class="${plan===k?'on':''}" style="padding:8px 4px;font-size:13px;${P(pid)[k]==null?'opacity:.55':''}" onclick="plan='${k}';upd()">${k[0].toUpperCase()+k.slice(1)}<br><span class="mut">${P(pid)[k]==null?'not set':inr(P(pid)[k])}</span></button>`).join('');
 $('#nb').innerHTML=unit()==null?'<span class="pos">Indha plan-ku price set pannala. Products tab-la set pannunga.</span>':'Bill: <b>'+inr(cAmt())+'</b> · New balance: <b>'+inr(base()+cAmt()-p)+'</b>'}
function saveDel(){const p=+$('#paid').value||0;if(unit()==null){toast('Indha plan-ku price illa');return}cur.bal=base()+cAmt()-p;
 if(ed){ed.qty=qty;ed.paid=p;ed.mode=p?mode:'-'}else log.push({cid:cur.id,name:cur.name,qty,paid:p,mode:p?mode:'-',by:me.id});
 closeM();render();toast(ed?'Updated':'Saved')}
function addCust(){
 $('#sheet').innerHTML=`<b>New customer</b><div style="display:grid;gap:10px;margin:12px 0"><input id="n" placeholder="Name"><input id="ph" placeholder="Phone number" inputmode="numeric"><input id="ar" placeholder="Area"><select id="dl" style="width:100%">${users.filter(u=>u.role==='delivery').map(u=>`<option value="${u.id}">${u.name}</option>`).join('')}</select></div><div class="err" id="er"></div>
 <div style="display:flex;gap:10px"><button onclick="closeM()">Cancel</button><button class="pri" style="flex:1" onclick="saveCust()">Add customer</button></div>`;
 $('#modal').classList.add('on');
}
function saveCust(){
 const n=$('#n').value.trim(),ph=$('#ph').value.trim(),ar=$('#ar').value.trim();
 if(!n||!ph){$('#er').textContent='Name and phone venum.';return}
 if(customers.some(c=>c.phone===ph)){$('#er').textContent='Indha phone number already irukku. Unique-ah irukkanum.';return}
 customers.push({id:nextCid(),name:n,phone:ph,area:ar,del:$('#dl').value,bal:0});
 dbSaveCust(customers[customers.length-1],true);closeM();render();toast('Customer added')}
function closeM(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1400)}
const todays=()=>log.filter(l=>l.date===T);
const matches=c=>{const s=sq.trim().toLowerCase();return !s||(c.name+' '+c.phone+' '+c.id+' '+c.area).toLowerCase().includes(s)};
const myList=()=>customers.filter(c=>(me.role==='admin'||c.del===me.id)&&matches(c));
function srch(){return `<input id="sq" type="search" placeholder="Search name, phone, area" value="${sq}" oninput="sq=this.value;$('#list').innerHTML=listHtml()" style="margin-bottom:12px">`}
function listHtml(){const L=myList();if(!L.length)return '<p class="mut">Customer kedaikkala.</p>';
 const done=id=>todays().some(l=>l.cid===id);
 return L.map(c=>`<div class="row"><div>${c.name} <span class="mut">${c.id}</span><div class="mut">📞 ${c.phone}${c.email?' · ✉️ '+c.email:''} · ${c.area}${me.role==='admin'?' · '+dn(c.del):''}</div><div class="mut">Added by ${dn(c.by).split(' ')[0]}${c.on?' · '+c.on.split('-').reverse().join('-'):''}</div>${c.loc?`<div><a href="${mapUrl(c.loc)}" target="_blank" rel="noopener" style="color:var(--man)">📍 Open map</a></div>`:''}${c.ed?`<div class="mut">Edited by ${dn(c.ed.by).split(' ')[0]} · ${fmt(c.ed.on)}</div>`:''}<div class="${c.bal?'pos':'zero'}">Balance ${inr(c.bal)}</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><button style="padding:6px 12px" onclick="hist('${c.id}')">History</button><button style="padding:6px 12px" onclick="editCust('${c.id}')">Edit</button>${me.role==='delivery'?(done(c.id)?`<span class="pill">Delivered</span><button style="padding:6px 12px" onclick="editDel('${c.id}')">Edit today</button>`:`<button class="pri" style="padding:6px 12px" onclick="openDel('${c.id}')">Deliver</button>`):''}</div></div>`).join('')}
function cust(){return `<button class="pri" style="margin-bottom:12px" onclick="addCust()">+ Add customer</button><button style="margin:0 0 12px 8px" onclick="expCust()">Export CSV</button>`+srch()+`<div class="card" id="list">${listHtml()}</div>`}

let hv=[];
function dl(name,rows){
 const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
 try{
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('CSV download started');
 }catch(e){
  try{
   const url='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
   const a=document.createElement('a');
   a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
   toast('CSV download started');
  }catch(err){toast('Export failed. Please try another browser.')}
 }
}

function saveProd(id){
 const n=$('#pnm').value.trim(),num=x=>{const t=$(x).value.trim();return t===''?null:+t};
 const d=num('#pd'),w=num('#pw'),m=num('#pm');
 if(!n){$('#er').textContent='Product name venum.';return}

 if([d,w,m].some(x=>x!=null&&(isNaN(x)||x<0))){$('#er').textContent='Price sariyaa kudunga.';return}
 if(PRODUCTS.some(p=>p.id!==id&&p.name.toLowerCase()===n.toLowerCase())){$('#er').textContent='Indha product already irukku.';return}
 const o={name:n,emoji:$('#pem').value.trim()||'🍽️',daily:d,weekly:w,monthly:m};
 if(id)Object.assign(P(id),o);else PRODUCTS.push(Object.assign({id:'p'+Date.now()},o));
 dbSyncProducts();closeM();render();toast('Product saved')}

async function fetchAll(table,order){let out=[],from=0;for(;;){const {data,error}=await sb.from(table).select('*').order(order,{ascending:true}).range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000}return out}
async function loadAll(uid){
 const [pf,pr,cu,de]=await Promise.all([fetchAll('profiles','created_at'),fetchAll('products','id'),fetchAll('customers','id'),fetchAll('deliveries','id')]);
 users.length=0;pf.forEach(p=>users.push({id:p.id,name:p.name,role:p.role,phone:p.phone||'',email:p.email||''}));
 const ord=['fruits','sprouts','basic','standard','royal'];
 if(pr.length){PRODUCTS=pr.map(p=>({id:p.id,name:p.name,emoji:p.emoji||'🍽️',daily:p.daily==null?null:+p.daily,weekly:p.weekly==null?null:+p.weekly,monthly:p.monthly==null?null:+p.monthly})).sort((a,b)=>{const x=ord.indexOf(a.id),y=ord.indexOf(b.id);return (x<0?99:x)-(y<0?99:y)||a.name.localeCompare(b.name)})}
 customers=cu.map(c=>({id:c.id,name:c.name,phone:c.phone||'',email:c.email||'',area:c.area||'',del:c.delivery_user,bal:+c.balance||0,by:c.created_by,on:c.created_on,loc:c.loc||undefined,edits:c.edits||[]}));
 log=de.map(d=>({dbid:d.id,cid:d.customer_id,name:d.customer_name,qty:d.qty,pid:d.product_id,pname:d.product_name,plan:d.plan,amt:+d.amount,paid:+d.paid,mode:d.mode||'-',by:d.delivered_by,date:d.delivery_date}));
 me=users.find(u=>u.id===uid)||null}
async function dbSaveDel(e,c){
 e.pname=P(e.pid).name;

 let r;
 if(e.dbid)r=await sb.from('deliveries').update(row).eq('id',e.dbid);
 else{r=await sb.from('deliveries').insert(row).select('id').single();if(!r.error)e.dbid=r.data.id}
 if(r.error)return dbFail(r.error);
 const r2=await sb.from('customers').update({balance:c.bal}).eq('id',c.id);if(r2.error)dbFail(r2.error)}
const custRow=c=>({name:c.name,phone:c.phone,email:c.email||null,area:c.area||null,delivery_user:c.del||null,balance:c.bal,loc:c.loc||null,edits:c.edits&&c.edits.length?c.edits:null});

 if(r.error&&r.error.code==='23505'){const n=await sb.rpc('next_customer_id');if(!n.error){c.id=n.data;r=await sb.from('customers').insert(Object.assign({id:c.id,created_by:c.by,created_on:c.on},custRow(c)));render()}}
 if(r.error)dbFail(r.error)}

function showLogin(){

async function doLogin(){
 if(!sb){$('#le').textContent='Internet illa. Page refresh pannunga.';return}
 const email=$('#lu').value.trim().toLowerCase(),pw=$('#lp').value;
 if(!email||!pw){$('#le').textContent='Email and password kudunga.';return}
 $('#le').textContent='Please wait...';
 const {error}=await sb.auth.signInWithPassword({email,password:pw});
 if(error){$('#le').textContent='Login aagala: '+(error.message||'unknown error');return}
 await startSession()}
async function startSession(){
 if(!sb){showLogin();return}
 const {data}=await sb.auth.getSession();const ses=data&&data.session;
 if(!ses){showLogin();return}
 $('#main').innerHTML='<p class="mut" style="margin-top:40px;text-align:center">Loading...</p>';
 try{await loadAll(ses.user.id)}catch(e){console.error(e);$('#main').innerHTML='<div class="card" style="margin-top:40px"><b>Data load aagala</b><div class="mut" style="margin:6px 0 12px">'+esc(e.message||e)+'</div><button class="pri" onclick="startSession()">Retry</button> <button onclick="logout()">Logout</button></div>';return}
 if(!me){await sb.auth.signOut();showLogin();$('#le').textContent='Indha account-ku access illa. Admin kitta kelunga.';return}
 tab=me.role==='admin'?'dash':'ddash';sq='';$('#out').textContent='Logout · '+me.name.split(' ')[0];$('#out').style.display='';render()}
async function logout(){try{await sb.auth.signOut()}catch(e){}me=null;users.length=0;customers=[];log=[];$('#out').style.display='none';closeM();showLogin()}

 if(p.length<6){$('#er').textContent='Password minimum 6 characters.';return}
 if(users.some(u=>u.phone===ph)){$('#er').textContent='Indha phone number already use aagudhu.';return}

 closeM();render();
